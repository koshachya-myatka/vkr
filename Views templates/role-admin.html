<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Администрирование</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Управление системой</h1>
  <button class="btn-add"><span class="material-symbols-outlined">add_circle</span> Добавить источник</button>
</header>

<main>
  <div class="filter-bar">
    <input type="text" placeholder="Поиск источника..." id="searchAdmin">
    <select id="filterStatusAdmin">
      <option value="">Все статусы</option>
      <option value="Активен">Активен</option>
      <option value="Верификация">Верификация</option>
    </select>
    <button class="btn btn-reset" onclick="resetFilters('admin')">Сброс</button>
  </div>

  <div class="section">
    <div class="data-header">
      <h2>Источники данных</h2>
    </div>
    <table class="table" id="adminTable">
      <tr><th>Название</th><th>Тип</th><th>Статус</th></tr>
      <tr><td>Лаборатория №1</td><td>Лабораторные анализы</td><td class="status-high">Активен</td></tr>
      <tr><td>Система производственного контроля</td><td>SCADA</td><td class="status-high">Активен</td></tr>
      <tr><td>Внешний мониторинг выбросов</td><td>API-интеграция</td><td class="status-medium">Верификация</td></tr>
    </table>
  </div>

  <div class="section" style="margin-top: 20px;">
    <h2>Пользователи</h2>
    <table class="table">
      <tr><th>Имя</th><th>Роль</th><th>Действия</th></tr>
      <tr><td>Иванов И.И.</td><td>Технолог</td><td><button class="btn"><span class="material-symbols-outlined">edit</span></button> <button class="btn"><span class="material-symbols-outlined">delete</span></button></td></tr>
      <tr><td>Петров П.П.</td><td>Служба качества</td><td><button class="btn"><span class="material-symbols-outlined">edit</span></button> <button class="btn"><span class="material-symbols-outlined">delete</span></button></td></tr>
    </table>
  </div>
</main>

<script>
function resetFilters(page){
  if(page==='admin'){
    document.getElementById('searchAdmin').value='';
    document.getElementById('filterStatusAdmin').value='';
    const rows = document.querySelectorAll('#adminTable tr');
    rows.forEach((row,i)=>{if(i>0) row.style.display='';});
  }
}
</script>
</body>
</html>
